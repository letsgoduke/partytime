customHeaders:
  - pattern: "**"
    headers:
      - key: Referrer-Policy
        value: no-referrer
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
  - pattern: /index.html
    headers:
      - key: Cache-Control
        value: no-store
  - pattern: /sw.js
    headers:
      - key: Cache-Control
        value: no-cache
