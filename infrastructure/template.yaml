AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Partytime private PostgreSQL, API, and passwordless Cognito authentication.

Parameters:
  AppOrigin:
    Type: String
    Description: Exact production frontend origin, HTTPS without a trailing slash.
    AllowedPattern: '^https://[^/?#]+$'
  AllowLocalhost:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Opt in to localhost:5173 CORS and OAuth callbacks for development.
  CognitoDomainPrefix:
    Type: String
    Description: Regionally unique Cognito managed login domain prefix.
    MinLength: 3
    MaxLength: 63
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
  SesIdentityArn:
    Type: String
    Default: ''
    Description: Optional verified SES identity ARN in a Cognito-supported email region.
    AllowedPattern: '^$|^arn:aws:ses:[a-z0-9-]+:[0-9]{12}:identity/.+$'
  SesFromAddress:
    Type: String
    Default: ''
    Description: Verified sender, required when SesIdentityArn is provided.
  DatabaseEngineVersion:
    Type: String
    AllowedPattern: '^16\.[0-9]+$'
    Description: Supported PostgreSQL 16 minor version; verify availability in the target region.
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium]
  DatabaseMultiAZ:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set true for production availability; increases database charges.

Rules:
  SesSenderRequired:
    Assertions:
      - Assert: !Or [!Equals [!Ref SesIdentityArn, ''], !Not [!Equals [!Ref SesFromAddress, '']]]
        AssertDescription: Set SesFromAddress when providing SesIdentityArn.

Conditions:
  UseSes: !Not [!Equals [!Ref SesIdentityArn, '']]
  UseMultiAZ: !Equals [!Ref DatabaseMultiAZ, 'true']
  IncludeLocalhost: !Equals [!Ref AllowLocalhost, 'true']

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-hosts'
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OFF'
      Policies:
        SignInPolicy:
          AllowedFirstAuthFactors: [EMAIL_OTP]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      EmailConfiguration: !If
        - UseSes
        - EmailSendingAccount: DEVELOPER
          SourceArn: !Ref SesIdentityArn
          From: !Ref SesFromAddress
        - EmailSendingAccount: COGNITO_DEFAULT
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false

  BrowserClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: Partytime browser
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !If
        - IncludeLocalhost
        - [!Sub '${AppOrigin}/auth/callback', 'http://localhost:5173/auth/callback']
        - [!Sub '${AppOrigin}/auth/callback']
      DefaultRedirectURI: !Sub '${AppOrigin}/auth/callback'
      LogoutURLs: !If
        - IncludeLocalhost
        - [!Sub '${AppOrigin}/', 'http://localhost:5173/']
        - [!Sub '${AppOrigin}/']
      ReadAttributes: [email, email_verified, name]
      WriteAttributes: [email, name]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 15
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  LoginDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2

  LoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: LoginDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref BrowserClient
      UseCognitoProvidedValues: true

  PrivateVpc:
    Type: AWS::EC2::VPC
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private'

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref PrivateVpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: false

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref PrivateVpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: false

  # Explicit isolated route tables: no Internet Gateway and no NAT Gateway.
  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref PrivateVpc
  RouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRoutes
  RouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRoutes

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GroupDescription: Partytime functions, with explicitly restricted outbound access.
      VpcId: !Ref PrivateVpc
      SecurityGroupEgress:
        # A harmless placeholder suppresses EC2's default allow-all egress.
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GroupDescription: PostgreSQL reachable only by the Partytime Lambda security group.
      VpcId: !Ref PrivateVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32

  SecretsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS Secrets Manager access only from Partytime functions.
      VpcId: !Ref PrivateVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32

  LambdaToDatabase:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
  LambdaToSecrets:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref SecretsSecurityGroup

  SecretsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref PrivateVpc
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref SecretsSecurityGroup]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: secretsmanager:GetSecretValue
            Resource: [!Ref RuntimeDatabaseSecret, !GetAtt Database.MasterUserSecret.SecretArn]

  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBSubnetGroupDescription: Isolated subnets across two availability zones.
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  DatabaseParameters:
    Type: AWS::RDS::DBParameterGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Require TLS for every PostgreSQL connection.
      Family: postgres16
      Parameters:
        rds.force_ssl: '1'

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Engine: postgres
      EngineVersion: !Ref DatabaseEngineVersion
      DBName: partytime
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: partytime_owner
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      DBParameterGroupName: !Ref DatabaseParameters
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: !If [UseMultiAZ, true, false]
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      EnableCloudwatchLogsExports: [postgresql]

  RuntimeDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Non-superuser database login for Partytime request functions.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"partytime_runtime"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true

  # API and migration functions have distinct roles; runtime cannot read the master secret.
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadRuntimeCredential
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref RuntimeDatabaseSecret
        - PolicyName: LambdaVpcAndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # These EC2 ENI operations require wildcard resources for Lambda VPC attachment.
              - Effect: Allow
                Action: [ec2:CreateNetworkInterface, ec2:DescribeNetworkInterfaces, ec2:DescribeSubnets, ec2:DeleteNetworkInterface, ec2:AssignPrivateIpAddresses, ec2:UnassignPrivateIpAddresses]
                Resource: '*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-api:log-stream:*'

  MigrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadMigrationCredentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!GetAtt Database.MasterUserSecret.SecretArn, !Ref RuntimeDatabaseSecret]
        - PolicyName: LambdaVpcAndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ec2:CreateNetworkInterface, ec2:DescribeNetworkInterfaces, ec2:DescribeSubnets, ec2:DeleteNetworkInterface, ec2:AssignPrivateIpAddresses, ec2:UnassignPrivateIpAddresses]
                Resource: '*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-migrate:log-stream:*'

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 14
  MigrationLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-migrate'
      RetentionInDays: 14
  GatewayLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      Description: Private host management and capability-protected guest operations.
      CorsConfiguration:
        AllowOrigins: !If
          - IncludeLocalhost
          - [!Ref AppOrigin, 'http://localhost:5173']
          - [!Ref AppOrigin]
        AllowMethods: [POST, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: HostIdentity
        Authorizers:
          HostIdentity:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience: [!Ref BrowserClient]
      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 40
      RouteSettings:
        'POST /guest':
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
        'POST /host':
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
      AccessLogSettings:
        DestinationArn: !GetAtt GatewayLogs.Arn
        # Never log query strings, bodies, headers, names, tokens, or addresses.
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength"}'

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: [ApiLogs, SecretsEndpoint, LambdaToDatabase, LambdaToSecrets]
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Description: Partytime request boundary; restricted non-superuser database access.
      CodeUri: ../backend/
      Handler: functions/api.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 20
      ReservedConcurrentExecutions: 10
      Role: !GetAtt ApiRole.Arn
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Environment:
        Variables:
          DB_SECRET_ARN: !Ref RuntimeDatabaseSecret
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: !GetAtt Database.Endpoint.Port
          DB_NAME: partytime
          RDS_CA_PATH: /var/runtime/ca-cert.pem
          COGNITO_ISSUER: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
          COGNITO_CLIENT_ID: !Ref BrowserClient
          APP_ORIGIN: !Ref AppOrigin
          ALLOWED_ORIGINS: !If
            - IncludeLocalhost
            - !Join [',', [!Ref AppOrigin, 'http://localhost:5173']]
            - !Ref AppOrigin
      Events:
        HostRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /host
            Method: POST
            PayloadFormatVersion: '2.0'
        GuestRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /guest
            Method: POST
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE

  MigrationFunction:
    Type: AWS::Serverless::Function
    DependsOn: [MigrationLogs, SecretsEndpoint, LambdaToDatabase, LambdaToSecrets]
    Properties:
      FunctionName: !Sub '${AWS::StackName}-migrate'
      Description: IAM invoke only; applies versioned SQL and provisions the runtime login.
      CodeUri: ../backend/
      Handler: functions/migrate.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Role: !GetAtt MigrationRole.Arn
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Environment:
        Variables:
          DB_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
          APP_DB_SECRET_ARN: !Ref RuntimeDatabaseSecret
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: !GetAtt Database.Endpoint.Port
          DB_NAME: partytime
          RDS_CA_PATH: /var/runtime/ca-cert.pem
      # Intentionally no Events or FunctionUrlConfig. Deployment does not execute migrations.

Outputs:
  AwsRegion:
    Value: !Ref AWS::Region
  ApiUrl:
    Description: Public API base URL; guest actions still require invitation or management capabilities.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoClientId:
    Description: Public OAuth client identifier, never a client secret.
    Value: !Ref BrowserClient
  CognitoIssuer:
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  CognitoDomain:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  MigrationFunctionName:
    Description: Invoke only through authorized AWS IAM credentials after reviewing migrations.
    Value: !Ref MigrationFunction
